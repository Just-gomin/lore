[package]
name = "lore"
version = "0.0.1"
edition = "2024"
description = "결정 기록을 코드 옆에 두고 조회하는 AI Native SDLC 도구"
license = "MIT"
repository = "https://github.com/Just-gomin/lore"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = "4.6.7"
globset = "0.4.21"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"

name: "Release"

# v로 시작하는 태그를 올리면 플랫폼별 바이너리를 빌드해 릴리스에 올립니다.
# lore install이 설치한 워크플로가 이 릴리스에서 같은 버전의 바이너리를 받습니다.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: "Repository Checkout"
        uses: actions/checkout@v6

      - name: "태그와 Cargo.toml 버전 확인"
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "태그 ${GITHUB_REF_NAME}와 Cargo.toml 버전 ${version}이 다릅니다." >&2
            exit 1
          fi

      - name: "릴리스 만들기"
        env:
          GH_TOKEN: ${{ github.token }}
        # 바이너리를 모두 올린 뒤 게시하도록 초안으로 만듭니다. 다시 돌릴 때는 있는 릴리스를 씁니다.
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          fi

  build:
    needs: release

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: "Repository Checkout"
        uses: actions/checkout@v6

      - name: "Build"
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release --locked --target "${{ matrix.target }}"

      - name: "Upload"
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          tar -czf "lore-${TARGET}.tar.gz" -C "target/${TARGET}/release" lore
          gh release upload "${GITHUB_REF_NAME}" "lore-${TARGET}.tar.gz" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: "Repository Checkout"
        uses: actions/checkout@v6

      - name: "게시"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

# lore install이 설치한 워크플로입니다. 고치면 lore install이 덮어쓰지 않고 lore uninstall이 지우지 않습니다.
name: "lore"

on:
  pull_request:
    types: ["opened", "synchronize", "reopened", "edited"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "lore-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LORE_VERSION: "{{LORE_VERSION}}"
      LORE_REPO: "{{LORE_REPO}}"
    steps:
      # merge-base와 이력 보고에 전체 이력이 필요합니다.
      - name: "Repository Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # lore 레포가 비공개면 읽을 수 있는 토큰을 LORE_TOKEN 시크릿에 넣습니다.
      - name: "lore 내려받기"
        env:
          GH_TOKEN: ${{ secrets.LORE_TOKEN || github.token }}
        run: |
          gh release download "v${LORE_VERSION}" --repo "${LORE_REPO}" --pattern "lore-x86_64-unknown-linux-gnu.tar.gz" --dir "${RUNNER_TEMP}"
          tar -xzf "${RUNNER_TEMP}/lore-x86_64-unknown-linux-gnu.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      # PR 설명은 셸 명령에 직접 넣지 않고 환경 변수로 받아 파일로 씁니다.
      - name: "lore check"
        id: check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          printf '%s\n' "${PR_BODY}" > "${RUNNER_TEMP}/pr-body.md"
          set +e
          lore check --base "origin/${BASE_REF}" --pr-body "${RUNNER_TEMP}/pr-body.md" > "${RUNNER_TEMP}/check.json"
          echo "code=$?" >> "${GITHUB_OUTPUT}"
          lore check --base "origin/${BASE_REF}" --pr-body "${RUNNER_TEMP}/pr-body.md" --for-human > "${RUNNER_TEMP}/check.txt" 2>&1
          cat "${RUNNER_TEMP}/check.txt"

      # PR마다 코멘트 하나를 두고 다시 돌면 고칩니다. 판단이 드는 검사의 기록은 실행마다 이어 붙입니다.
      - name: "PR 코멘트"
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            const fs = require("fs");
            const dir = process.env.RUNNER_TEMP;
            const text = fs.readFileSync(`${dir}/check.txt`, "utf8").trimEnd();
            let result = {};
            try {
              result = JSON.parse(fs.readFileSync(`${dir}/check.json`, "utf8"));
            } catch (error) {
              core.warning(`lore check의 JSON을 읽지 못했습니다: ${error}`);
            }
            const mark = "lore-check-record";
            const findings = {};
            for (const check of result.checks || []) {
              if (!check.blocking && check.findings) {
                findings[check.id] = check.findings;
              }
            }
            const run = {
              sha: context.payload.pull_request.head.sha,
              ok: result.ok === true,
              findings,
            };
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const old = comments.find((comment) => (comment.body || "").includes(`<!-- ${mark}\n`));
            let runs = [];
            const recorded = old && old.body.match(new RegExp(`<!-- ${mark}\\n([^\\n]*)\\n-->`));
            if (recorded) {
              try {
                runs = JSON.parse(recorded[1]);
              } catch (error) {
                core.warning(`이전 기록을 읽지 못했습니다: ${error}`);
              }
            }
            runs = runs.filter((previous) => previous.sha !== run.sha);
            runs.push(run);
            // HTML 주석 안에 "--"가 들어가지 않게 합니다.
            const record = JSON.stringify(runs).replace(/--/g, "-\\u002d");
            const body = `### lore check\n\n\`\`\`text\n${text}\n\`\`\`\n\n<!-- ${mark}\n${record}\n-->\n`;
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: "결과"
        env:
          CODE: ${{ steps.check.outputs.code }}
        run: exit "${CODE}"
